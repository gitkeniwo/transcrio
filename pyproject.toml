[project]
name = "transcribe"
version = "0.2.0"
description = "Local audio/video transcription CLI (Qwen3-ASR on Apple Silicon via MLX)"
readme = "README.md"
license = "LicenseRef-GLWTPL"
license-files = ["LICENSE"]
authors = [
    { name = "gitkeniwo", email = "34304497+gitkeniwo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx-qwen3-asr>=0.4.4",
]

[project.scripts]
transcribe = "transcribe.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
